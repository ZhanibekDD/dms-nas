<svg viewBox="0 0 220 60" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Icon: rounded square -->
  <rect x="2" y="4" width="52" height="52" rx="13" fill="url(#g1)"/>

  <!-- Archive lines inside icon -->
  <rect x="12" y="17" width="32" height="5" rx="2.5" fill="url(#g2)"/>
  <rect x="12" y="27" width="24" height="5" rx="2.5" fill="white" fill-opacity="0.7"/>
  <rect x="12" y="37" width="28" height="5" rx="2.5" fill="white" fill-opacity="0.45"/>

  <!-- ДАС main text -->
  <text x="66" y="38"
        font-family="'Arial Black','Arial',sans-serif"
        font-weight="900"
        font-size="30"
        letter-spacing="-0.5"
        fill="#1e293b">ДАС</text>

  <!-- Subtitle -->
  <text x="68" y="52"
        font-family="'Arial',sans-serif"
        font-size="9.5"
        letter-spacing="0.8"
        fill="#64748b">ДОКУМЕНТАЛЬНАЯ АРХИВНАЯ СИСТЕМА</text>
</svg>
